onboarding = false

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "herdr plugin action invoke open-dashboard --plugin llmtrim.proxy"
description = "llmtrim: savings dashboard"

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "herdr plugin action invoke summary --plugin llmtrim.proxy"
description = "llmtrim: session savings"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = "herdr plugin action invoke diagnose --plugin llmtrim.proxy"
description = "llmtrim: diagnose"
