set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# ========================================
# 基础设置
# ========================================

# 支持鼠标
set-option -g mouse on

# 解决 neovim ESC 延迟问题
set -sg escape-time 0

# 增加滚动缓冲区大小
set -g history-limit 50000

# tmux 消息显示时长
set -g display-time 4000

# 更频繁刷新状态栏
set -g status-interval 5

# 启用焦点事件（Neovim 必备）
set -g focus-events on

# 多显示器 + grouped sessions 更好用
setw -g aggressive-resize on

# vi 模式
setw -g mode-keys vi

# 窗口和面板从 1 开始
set -g base-index 1
set -g pane-base-index 1

# 真彩色支持（专业建议：使用 tmux-256color 而不是 screen-256color）
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# ========================================
# 插件列表
# ========================================
set -g @plugin 'smart-splits-nvim/smart-splits.nvim'
set -g @plugin 'and-rs/flash.tmux'

# --- smart-splits.nvim：Neovim 与 tmux 面板无缝导航 ---
# 绑定由插件自带的 smart-splits.tmux（TPM 加载时执行）生成，
# 依赖 Neovim 侧设置的 pane 级变量 @pane-is-vim。
# 键位与 Neovim 保持一致：Alt+hjkl 移动，Alt+Shift+hjkl 调整大小
set -g @smart-splits_move_left_key  'M-h'
set -g @smart-splits_move_down_key  'M-j'
set -g @smart-splits_move_up_key    'M-k'
set -g @smart-splits_move_right_key 'M-l'

set -g @smart-splits_resize_left_key  'M-H'
set -g @smart-splits_resize_down_key  'M-J'
set -g @smart-splits_resize_up_key    'M-K'
set -g @smart-splits_resize_right_key 'M-L'

set -g @smart-splits_resize_step_size '3'
# set -g @smart-splits_no_wrap '1' # 取消边缘环绕（默认开启环绕）
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
