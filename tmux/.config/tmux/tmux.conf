set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# ========================================
# 基础设置
# ========================================

# 支持鼠标
set-option -g mouse on

# 解决 neovim ESC 延迟问题
set -sg escape-time 0

# 增加滚动缓冲区大小
set -g history-limit 50000

# tmux 消息显示时长
set -g display-time 4000

# 更频繁刷新状态栏
set -g status-interval 5

# 启用焦点事件（Neovim 必备）
set -g focus-events on

# 多显示器 + grouped sessions 更好用
setw -g aggressive-resize on

# vi 模式
setw -g mode-keys vi

# 窗口和面板从 1 开始
set -g base-index 1
set -g pane-base-index 1

# 真彩色支持（专业建议：使用 tmux-256color 而不是 screen-256color）
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# ========================================
# smart-splits.nvim：Neovim 与 tmux 面板无缝导航
# 依赖 Neovim 侧 smart-splits.nvim 在加载时设置的 pane 级变量 @pane-is-vim
# 键位与 Neovim 保持一致：Alt+hjkl 移动，Alt+Shift+hjkl 调整大小
# ========================================

# 移动（与 Neovim 的 <A-hjkl> 对齐）
bind-key -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'select-pane -R'

# 调整大小（与 Neovim 的 <A-HJKL> 对齐）
bind-key -n M-H if -F "#{@pane-is-vim}" 'send-keys M-H' 'resize-pane -L 3'
bind-key -n M-J if -F "#{@pane-is-vim}" 'send-keys M-J' 'resize-pane -D 3'
bind-key -n M-K if -F "#{@pane-is-vim}" 'send-keys M-K' 'resize-pane -U 3'
bind-key -n M-L if -F "#{@pane-is-vim}" 'send-keys M-L' 'resize-pane -R 3'

# copy-mode-vi 下也能切换面板
bind-key -T copy-mode-vi M-h select-pane -L
bind-key -T copy-mode-vi M-j select-pane -D
bind-key -T copy-mode-vi M-k select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R

# ========================================
# 插件列表
# ========================================
set -g @plugin 'and-rs/flash.tmux'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
