# ========================================
# 基础设置
# ========================================

# 支持鼠标
set-option -g mouse on

# 解决 neovim ESC 延迟问题
set -sg escape-time 0

# 增加滚动缓冲区大小
set -g history-limit 50000

# tmux 消息显示时长
set -g display-time 4000

# 更频繁刷新状态栏
set -g status-interval 5

# 启用焦点事件（Neovim 必备）
set -g focus-events on

# 多显示器 + grouped sessions 更好用
setw -g aggressive-resize on

# vi 模式
setw -g mode-keys vi

# 窗口和面板从 1 开始
set -g base-index 1
set -g pane-base-index 1

# 真彩色支持（专业建议：使用 tmux-256color 而不是 screen-256color）
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# ========================================
# 智能切换：检测当前 pane 是否在 Neovim 中
# ========================================

# # 定义 @pane-is-vim 变量
# is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
# set -g @pane-is-vim "$is_vim"

# ========================================
# 键位映射（完全对齐 Neovim smart-splits）
# ========================================

# 1. 移动焦点：Shift+Alt+hjkl（对齐 Neovim 的 <S-A-h/j/k/l>）
bind-key -n M-H if -F "#{@pane-is-vim}" "send-keys M-H" "select-pane -L"
bind-key -n M-J if -F "#{@pane-is-vim}" "send-keys M-J" "select-pane -D"
bind-key -n M-K if -F "#{@pane-is-vim}" "send-keys M-K" "select-pane -U"
bind-key -n M-L if -F "#{@pane-is-vim}" "send-keys M-L" "select-pane -R"

# 2. 调整大小：Shift+Ctrl+hjkl（对齐 Neovim 的 <S-C-h/j/k/l>）
bind-key -n C-H if -F "#{@pane-is-vim}" "send-keys C-H" "resize-pane -L 5"
bind-key -n C-J if -F "#{@pane-is-vim}" "send-keys C-J" "resize-pane -D 5"
bind-key -n C-K if -F "#{@pane-is-vim}" "send-keys C-K" "resize-pane -U 5"
bind-key -n C-L if -F "#{@pane-is-vim}" "send-keys C-L" "resize-pane -R 5"

# 3. 上一个 pane：Ctrl+[（对齐 Neovim 的 <C-[>）
bind-key -n C-[ if -F "#{@pane-is-vim}" "send-keys C-[" "select-pane -l"

# ========================================
# tmux 复制模式下的键位（保持习惯一致）
# ========================================

bind-key -T copy-mode-vi 'M-H' select-pane -L
bind-key -T copy-mode-vi 'M-J' select-pane -D
bind-key -T copy-mode-vi 'M-K' select-pane -U
bind-key -T copy-mode-vi 'M-L' select-pane -R
bind-key -T copy-mode-vi 'C-H' resize-pane -L 5
bind-key -T copy-mode-vi 'C-J' resize-pane -D 5
bind-key -T copy-mode-vi 'C-K' resize-pane -U 5
bind-key -T copy-mode-vi 'C-L' resize-pane -R 5
bind-key -T copy-mode-vi 'C-[' select-pane -l
